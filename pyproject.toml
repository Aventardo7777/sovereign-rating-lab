[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-rating-lab"
version = "0.1.0"
description = "主权信用评级迁移与预测研究 — Sovereign Credit Rating Migration & Prediction Lab"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jietao Liu", email = "176105827+Aventardo7777@users.noreply.github.com" }]
maintainers = [{ name = "Jietao Liu", email = "176105827+Aventardo7777@users.noreply.github.com" }]
keywords = [
  "sovereign-credit-rating",
  "rating-migration",
  "credit-risk",
  "macroeconomic-drivers",
  "ordinal-regression",
  "machine-learning",
  "event-study",
  "panel-data",
  "reproducible-research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Office/Business :: Financial",
]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "statsmodels>=0.14.2",
  "linearmodels>=6.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "shap>=0.44",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.20",
  "streamlit>=1.33",
  "PyYAML>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "openpyxl>=3.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.4",
  "pre-commit>=3.7",
  "jupyter>=1.0",
  "nbformat>=5.10",
  "ipykernel>=6.29",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/Aventardo7777/sovereign-rating-lab"
Repository = "https://github.com/Aventardo7777/sovereign-rating-lab"
Issues = "https://github.com/Aventardo7777/sovereign-rating-lab/issues"
Changelog = "https://github.com/Aventardo7777/sovereign-rating-lab/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Aventardo7777/sovereign-rating-lab/tree/main/docs"

[tool.setuptools]
packages = [
  "src",
  "src.ingest",
  "src.clean",
  "src.features",
  "src.analysis",
  "src.models",
  "src.visualization",
  "src.utils",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
# notebook 的代码单元格由 ruff 负责检查（black 需要 black[jupyter] 才能处理 .ipynb，
# 为避免 CI 中出现 "Skipping .ipynb" 的噪音提示，这里显式排除 notebooks 目录）。
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
  | notebooks
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app", "scripts"]
exclude = [".venv", "build", "dist", "data/raw/cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # line length handled by black
  "N806",   # non-lowercase variable in function (X is idiomatic for design matrices)
  "N803",   # argument name should be lowercase (X)
  "B008",   # function call in default argument (fine for typer-style defaults)
  "RUF001", # ambiguous unicode character in string (Chinese punctuation)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N802"]
"notebooks/*" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "network: marks tests that require network access",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
